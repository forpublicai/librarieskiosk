<!doctype html>
<html>
<head><meta charset="utf-8"><title>TextField preview</title></head>
<body style="margin:0">
<div id="root" class="lk-app" style="padding:16px"></div>
<script>
  var K = window.Kiosk, h = React.createElement;
  
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16, maxWidth: 560 } }, h(K.TextField, { label: 'Library card number or username', placeholder: 'For example: jsmith', hint: 'Ask at the front desk if you do not have one.' }), h(K.TextField, { label: 'Password', type: 'password', defaultValue: 'abc', error: 'That password does not match. Try again or reset it.' })));
</script>
</body>
</html>
