<!-- @dsCard group="Screens" height=860 width=1280 page subtitle="Home: greeting and tool tiles" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Home screen preview</title></head>
<body style="margin:0">
<div id="root" class="lk-app" style="min-height:860px"></div>
<script>
  var K = window.Kiosk, h = React.createElement;
  function noop() {}
  function at(col, row, el) { return h('div', { style: { gridColumn: col, gridRow: row, display: 'flex' } }, el); }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(K.AppHeader, { logoLight: '/_blob/94aadda89d397e091a23d6a22e48edad', logoDark: '/_blob/4aa0921299c599770d95d20e70462a30', credits: 42, renewsAt: 'Monday at 12:00 AM', onAccount: noop, onToggleTheme: noop, onSignOut: noop }),
    h('main', { style: { maxWidth: 1120, margin: '0 auto', padding: 'var(--space-7) var(--space-6)' } },
      h('h1', { style: { font: '900 48px/52px var(--font-sans)', letterSpacing: '-0.015em', margin: '0 0 32px' } }, 'Hi Sam, what would you like to do today?'),
      h('div', { style: { display: 'grid', gridTemplateColumns: '1.3fr 1.3fr 1fr 1fr', gridTemplateRows: 'auto auto', gap: 'var(--space-4)' } },
        at('1 / 3', '1 / 3', h(K.ModeCard, { hero: true, tool: 'chat', title: 'Chat', description: 'Ask a question, get help writing, or plan something.', cost: 'Free' })),
        at('3', '1', h(K.ModeCard, { tool: 'image', title: 'Image', description: 'Describe a picture. The AI draws it.', cost: '1 credit' })),
        at('4', '1', h(K.ModeCard, { tool: 'music', title: 'Music', description: 'Make a short song.', cost: '5 credits per 10 sec' })),
        at('3', '2', h(K.ModeCard, { tool: 'video', title: 'Video', description: 'Turn an idea into a clip.', cost: '25 credits per 10 sec' })),
        at('4', '2', h(K.ModeCard, { tool: 'code', title: 'Code', description: 'Write and fix code.', cost: '1 credit' }))
      ),
      h('div', { style: { marginTop: 'var(--space-6)' } },
        h(K.Notice, { tone: 'info', title: 'New here?', action: h(K.Button, { variant: 'secondary', icon: 'help' }, 'Take the tour') }, 'A one-minute tour shows how each tool works.')
      )
    )
  ));
</script>
</body>
</html>
