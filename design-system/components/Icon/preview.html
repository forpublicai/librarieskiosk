<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon preview</title></head>
<body style="margin:0">
<div id="root" class="lk-app" style="padding:16px"></div>
<script>
  var K = window.Kiosk, h = React.createElement;
  
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(96px, 1fr))', gap: 8 } }, K.Icon.names.map(function (n) { return h('div', { key: n, style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, padding: 8, color: 'var(--ink)' } }, h(K.Icon, { name: n }), h('span', { style: { fontSize: 15, color: 'var(--ink-muted)' } }, n)); })));
</script>
</body>
</html>
